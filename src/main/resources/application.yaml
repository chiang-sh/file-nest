spring:
  application:
    name: file-nest
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
springdoc:
  swagger-ui:
    path: /swagger-ui.html
security:
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods:
      GET,
      POST,
      PUT,
      PATCH,
      DELETE,
      OPTIONS
  permitted-urls:
    /api/auth/login,
    /api/auth/register,
    /v3/api-docs/**,
    /v3/api-docs.yaml,
    /swagger-ui/**,
    /swagger-ui.html
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}